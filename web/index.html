<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141A24">
<title>Jharokha</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="core/jharokha.css">
<script src="core/jharokha.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;min-height:100vh;
  background:radial-gradient(ellipse 80% 45% at 50% -10%,var(--j-glow),transparent 70%) no-repeat,var(--j-bg)}
.wrap{max-width:1180px;margin:0 auto;padding:28px clamp(18px,4vw,48px) 60px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{width:40px;height:40px}
.brand .w{font-family:Marcellus,serif;font-size:30px;line-height:1;color:var(--j-text)}
.brand .h{font-family:"Tiro Devanagari Hindi",serif;font-size:16px;color:var(--j-muted);display:block;margin-top:2px}
.clock{text-align:right;color:var(--j-text-2);font-size:14px;line-height:1.3}
.clock b{display:block;font-size:22px;color:var(--j-text);font-weight:500}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--j-line);background:var(--j-surface);color:var(--j-text);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--j-accent)}
.iconbtn svg{width:22px;height:22px}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:500;font-size:clamp(26px,3.4vw,38px);margin:34px 0 18px;line-height:1.2}
h1 span{color:var(--j-accent)}
.search{display:flex;gap:10px;align-items:center;position:relative}
.search .box{flex:1;display:flex;align-items:center;gap:10px;background:var(--j-surface);border:1px solid var(--j-line);border-radius:999px;padding:0 8px 0 18px}
.search .box svg{width:20px;height:20px;color:var(--j-muted);flex:0 0 auto}
.search input{flex:1;background:transparent;border:0;color:var(--j-text);font:inherit;font-size:17px;padding:14px 4px}
.search input::placeholder{color:var(--j-muted)}
.mic{width:52px;height:52px;border-radius:50%;border:0;background:var(--j-accent);color:var(--j-on-accent);display:grid;place-items:center;cursor:pointer;flex:0 0 52px}
.mic svg{width:24px;height:24px}
.results{margin-top:10px;display:grid;gap:6px}
.res{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--j-surface);border:1px solid var(--j-line);border-radius:12px;padding:12px 16px;color:var(--j-text);font:inherit;cursor:pointer}
.res:hover{border-color:var(--j-accent)}
.res small{display:block;color:var(--j-muted);font-size:13px}
.res .ic{width:34px;height:34px;border-radius:10px;background:var(--j-surface-2);display:grid;place-items:center;color:var(--j-accent);flex:0 0 34px}
.res .ic svg{width:18px;height:18px}
.empty{color:var(--j-muted);padding:8px 4px}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--j-muted);font-weight:600;margin:36px 0 12px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--j-text);background:var(--j-surface);border:1px solid var(--j-line);border-radius:18px;padding:20px;min-height:170px;position:relative;overflow:hidden;transition:transform .15s}
.tile:hover{border-color:var(--j-accent)}
.tile:focus-visible{transform:scale(1.03)}
.tile .ic{width:48px;height:48px;border-radius:14px;background:var(--j-accent);color:var(--j-on-accent);display:grid;place-items:center}
.tile .ic svg{width:26px;height:26px}
.tile b{font-size:18px;font-weight:600;line-height:1.25}
.tile span{color:var(--j-text-2);font-size:14px;line-height:1.4}
.tile .tag{position:absolute;top:18px;right:18px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--j-muted)}
.tile.small{min-height:auto;flex-direction:row;align-items:center;padding:14px 16px}
.tile.small .ic{width:38px;height:38px;border-radius:11px;background:var(--j-surface-2);color:var(--j-accent);flex:0 0 38px}
.tile.small .ic svg{width:20px;height:20px}
.tile.small b{font-size:15px}.tile.small span{font-size:13px}
.notice{margin-top:22px;background:var(--j-surface);border:1px solid var(--j-accent);border-radius:14px;padding:14px 18px;color:var(--j-text)}
.notice b{color:var(--j-accent)}
footer{margin-top:48px;color:var(--j-muted);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}
/* settings modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.sheet{background:var(--j-bg);border:1px solid var(--j-line);border-radius:22px;max-width:980px;width:100%;max-height:92vh;overflow:auto;padding:26px 28px}
.sheet h3{font-family:"Source Serif 4",serif;font-weight:500;font-size:26px;margin:0 0 4px}
.sheet p{color:var(--j-text-2);margin:0 0 18px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.th{border:2px solid var(--j-line);border-radius:16px;padding:14px 12px 12px;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center;gap:10px}
.th.on{border-color:var(--j-accent)}
.th .stack{display:flex;flex-direction:column;align-items:center;width:100%}
.th .stack i{display:block;width:84%;height:22px;border-radius:999px;margin-top:-7px;box-shadow:0 -3px 8px rgba(0,0,0,.25)}
.th .stack i:first-child{margin-top:0}
.th span{font-size:14px;font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}
.fields label{display:block;font-size:13px;color:var(--j-text-2);margin-bottom:6px}
.fields input,.fields select{width:100%;background:var(--j-surface);color:var(--j-text);border:1px solid var(--j-line);border-radius:10px;padding:11px 12px;font:inherit}
.btn{background:var(--j-surface);color:var(--j-text);border:1px solid var(--j-line);border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}
.btn.pri{background:var(--j-accent);color:var(--j-on-accent);border-color:var(--j-accent);font-weight:600}
.sheet .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
@media (max-width:640px){.clock{display:none}.brand .w{font-size:24px}}
</style>
</head>
<body data-jharokha-hub>
<div class="wrap">
<header>
  <div class="brand">
    <svg viewBox="0 0 200 200" aria-hidden="true"><path d="M46,72 A16,16 0 0 1 62,50 A16,16 0 0 1 82,34 A14,14 0 0 1 100,24 A14,14 0 0 1 118,34 A16,16 0 0 1 138,50 A16,16 0 0 1 154,72 A16,16 0 0 1 160,100 L160,138 A44,44 0 0 1 72,138" fill="none" stroke="var(--j-accent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="8" r="6" fill="var(--j-accent)"/></svg>
    <div><span class="w">Jharokha</span><span class="h">झरोखा</span></div>
  </div>
  <div class="clock" aria-live="off"><b id="time">--:--</b><span id="date"></span></div>
  <button class="iconbtn" id="openSettings" aria-label="Themes and settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.1-4-7.6-9-7.6z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7.2" r="1.2"/><circle cx="15" cy="7.6" r="1.2"/></svg>
  </button>
</header>

<h1 id="greet">Welcome</h1>

<div class="search" role="search">
  <div class="box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" placeholder="Search everything — try “Incoterms” or “UCP 600”" aria-label="Search Jharokha">
  </div>
  <button class="mic" id="mic" aria-label="Search by voice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
</div>
<div class="results" id="results" aria-live="polite"></div>

<div id="notice"></div>

<section id="recentSec" hidden>
  <h2>Continue</h2>
  <div class="row" id="recent"></div>
</section>

<section>
  <h2>Your apps</h2>
  <div class="row" id="apps"><div class="empty">Loading…</div></div>
</section>

<footer><span id="ver">Jharokha</span><span>Built with Claude · nkotwar/jharokha</span></footer>
</div>

<div class="modal" id="settings" data-j-modal role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet">
    <h3 id="setTitle">Make it yours</h3>
    <p>Pick a theme — it applies everywhere in Jharokha.</p>
    <div class="themes" id="themes"></div>
    <div class="fields">
      <div><label for="name">Name for the greeting</label><input id="name" maxlength="30"></div>
      <div><label for="vlang">Voice search language</label>
        <select id="vlang"><option value="en-IN">English (India)</option><option value="hi-IN">Hindi</option><option value="en-US">English (US)</option></select></div>
      <div><label for="tvmode">Remote-friendly mode</label>
        <select id="tvmode"><option value="auto">Automatic</option><option value="on">Always on</option><option value="off">Off</option></select></div>
    </div>
    <div class="actions"><button class="btn pri" id="closeSettings">Done</button></div>
  </div>
</div>

<script>
(function(){
const J = window.Jharokha, $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* icons for tiles — add more as new kinds of apps arrive */
const ICONS = {
  learn:'<path d="M3 6.5 12 3l9 3.5-9 3.5z"/><path d="M7 8.3V14c0 1.7 2.2 3 5 3s5-1.3 5-3V8.3"/><path d="M21 6.5V12"/>',
  tool:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  media:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="m10 9 5 2-5 2z"/><path d="M8 21h8"/>',
  doc:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  section:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]||ICONS.doc}</svg>`;

/* clock + greeting */
function tick(){
  const d = new Date(), h = d.getHours();
  $('#time').textContent = d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  $('#date').textContent = d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
  const part = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const name = J.pref('name') ?? 'Buc';
  $('#greet').innerHTML = name ? `${part}, <span>${esc(name)}</span>` : part;
}
tick(); setInterval(tick, 30000);

/* registry + search */
let REG = {modules:[]}, INDEX = [];
function buildIndex(){
  INDEX = [];
  REG.modules.forEach(m => {
    INDEX.push({kind:'app', title:m.title, sub:m.subtitle, url:m.path, icon:m.icon, text:[m.title,m.subtitle,(m.keywords||[]).join(' ')].join(' ').toLowerCase()});
    (m.sections||[]).forEach(s => INDEX.push({kind:'section', title:s.t, sub:m.title, url:m.path+'#'+s.h, icon:'section', text:(s.t+' '+(s.k||'')).toLowerCase()}));
  });
}
function search(q){
  const box = $('#results');
  q = q.trim().toLowerCase();
  if(!q){ box.innerHTML=''; return []; }
  const words = q.split(/\s+/).filter(Boolean);
  const hits = INDEX.map(it => {
    let s = 0;
    words.forEach(w => { if(it.title.toLowerCase().includes(w)) s += 3; else if(it.text.includes(w)) s += 1; else if(w.length>3 && it.text.includes(w.slice(0,-1))) s += .5; });
    if(it.title.toLowerCase().startsWith(q)) s += 2;
    return {it, s};
  }).filter(h => h.s > 0).sort((a,b) => b.s - a.s).slice(0, 8);
  box.innerHTML = hits.length ? hits.map(h => `<button class="res" data-url="${esc(h.it.url)}"><span class="ic">${icon(h.it.icon)}</span><span><b>${esc(h.it.title)}</b><small>${h.it.kind==='app'?'App':'In '+esc(h.it.sub)}</small></span></button>`).join('')
    : `<div class="empty">Nothing found for “${esc(q)}”.</div>`;
  box.querySelectorAll('.res').forEach(b => b.onclick = () => openUrl(b.dataset.url));
  return hits;
}
function openUrl(u){ location.href = J.ROOT + u; }
$('#q').addEventListener('input', e => search(e.target.value));
$('#q').addEventListener('keydown', e => { if(e.key==='Enter' && !e.target.hasAttribute('data-j-locked')){ const f = $('#results .res'); if(f){ e.preventDefault(); f.focus(); } } });

/* voice */
function startVoice(){
  J.voice.start(text => {
    $('#q').value = text; const hits = search(text);
    J.toast(hits.length ? `“${text}”` : `No match for “${text}”`);
    const f = $('#results .res'); if(f) f.focus();
  }, J.pref('voiceLang') || 'en-IN');
}
if(!J.voice.available()) $('#mic').hidden = true;
$('#mic').onclick = startVoice;
document.addEventListener('jharokha:search', () => { J.voice.available() ? startVoice() : $('#q').focus(); });
if(location.hash === '#search'){ history.replaceState(null,'',location.pathname); setTimeout(() => $('#q').focus(), 100); }

/* tiles */
function renderApps(){
  $('#apps').innerHTML = REG.modules.length ? REG.modules.map(m => `<a class="tile" href="${esc(J.ROOT+m.path)}"><span class="tag">${esc(m.category||'')}</span><span class="ic">${icon(m.icon)}</span><b>${esc(m.title)}</b><span>${esc(m.subtitle||'')}</span></a>`).join('')
    : '<div class="empty">No apps yet.</div>';
}
function renderRecent(){
  const r = J.recent().slice(0, 4);
  $('#recentSec').hidden = !r.length;
  $('#recent').innerHTML = r.map(x => `<a class="tile small" href="${esc(x.url)}"><span class="ic">${icon('clock')}</span><span><b>${esc(x.title)}</b><br><span>${esc(x.sub||'')}</span></span></a>`).join('');
}
renderRecent();

J.loadJSON('modules/registry.json').then(r => { REG = r; buildIndex(); renderApps(); focusFirst(); })
  .catch(() => { $('#apps').innerHTML = '<div class="empty">Couldn’t load apps. Check the connection and reopen.</div>'; });

/* version / app update notice */
J.loadJSON('version.json').then(v => {
  const apk = J.apkVersion();
  const appName = J.nativeHas('versionName') ? J.native.versionName() : apk;
  $('#ver').textContent = `Jharokha web ${v.web}` + (apk ? ` · App ${appName} (build ${apk})` : '') + (v.built ? ` · ${v.built}` : '');
  if(apk != null && apk < v.minApk){
    $('#notice').innerHTML = `<div class="notice"><b>App update needed.</b> Some features need the newer Jharokha app. In <i>Downloader</i>, open <b>${esc(v.apkShortUrl||v.apkUrl)}</b> and install.</div>`;
  } else if(apk != null && apk < v.latestApk){
    $('#notice').innerHTML = `<div class="notice"><b>New app version available</b> (optional). In <i>Downloader</i>, open <b>${esc(v.apkShortUrl||v.apkUrl)}</b>.</div>`;
  }
}).catch(() => {});

function focusFirst(){ if(J.isTV && document.activeElement === document.body){ const t = $('#recent .tile') || $('#apps .tile'); if(t) t.focus({preventScroll:true}); } }

/* settings */
const modal = $('#settings');
function renderThemes(){
  const cur = document.documentElement.getAttribute('data-theme');
  $('#themes').innerHTML = J.THEMES.map(t => `<button class="th ${t.id===cur?'on':''}" data-id="${t.id}" aria-pressed="${t.id===cur}" style="background:${t.sw[0]}"><span class="stack">${t.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span style="color:${t.id==='daylight'?'#1D2430':'#F4EFE6'}">${t.name}</span></button>`).join('');
  $('#themes').querySelectorAll('.th').forEach(b => b.onclick = () => { J.setTheme(b.dataset.id); renderThemes(); $('#themes [data-id="'+b.dataset.id+'"]').focus(); });
}
function openSettings(){
  renderThemes();
  $('#name').value = J.pref('name') ?? 'Buc';
  $('#vlang').value = J.pref('voiceLang') || 'en-IN';
  const tv = J.pref('tvmode'); $('#tvmode').value = tv === true ? 'on' : tv === false ? 'off' : 'auto';
  modal.classList.add('open');
  ($('#themes .th.on') || $('#themes .th')).focus();
}
function closeSettings(){
  J.pref('name', $('#name').value.trim());
  J.pref('voiceLang', $('#vlang').value);
  const tv = $('#tvmode').value; J.pref('tvmode', tv === 'on' ? true : tv === 'off' ? false : null);
  modal.classList.remove('open'); tick(); $('#openSettings').focus();
}
$('#openSettings').onclick = openSettings;
$('#closeSettings').onclick = closeSettings;
modal.addEventListener('j-close', closeSettings);
modal.addEventListener('click', e => { if(e.target === modal) closeSettings(); });

/* offline support */
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
</body>
</html>
