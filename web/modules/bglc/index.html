<script>
/* ================= DATA ================= */
const NAV = [
 ["Start",[["home","Course map"],["foundations","1 · Why trade needs banks"]]],
 ["Bank Guarantee",[["bg","2 · BG fundamentals"],["bg-types","3 · Types of BG"],["bg-life","4 · BG lifecycle & invocation"],["bg-law","5 · Law, fraud & URDG 758"]]],
 ["Letter of Credit",[["lc","6 · LC fundamentals & parties"],["lc-avail","7 · How an LC pays (availability)"],["lc-types","8 · Types of LC"],["lc-flow","9 · LC flow simulator"],["docs","10 · Documents under LC"],["ucp","11 · UCP 600 article by article"],["dates","12 · Dates, tolerances & interpretation"]]],
 ["Trade terms & plumbing",[["incoterms","13 · Incoterms 2020 explorer"],["banks","14 · Every bank & its role"],["swift","15 · SWIFT / SFMS messages"],["compare","16 · BG vs LC vs SBLC vs Collection"]]],
 ["India",[["india","17 · Indian regulation & practice"]]],
 ["Practice",[["tools","Calculators"],["cases","Spot the discrepancy"],["quiz","Final quiz"],["glossary","Glossary"]]]
];
const ORDER = NAV.flatMap(g=>g[1].map(x=>x[0]));
const TITLES = Object.fromEntries(NAV.flatMap(g=>g[1]));

const BGTYPES = [
 {n:"Bid Bond / Tender Guarantee / EMD guarantee",cls:"Performance",why:"Protects the tender-inviting authority if the bidder withdraws its bid during validity, or refuses to sign the contract / furnish the performance guarantee after award.",amt:"Typically 1–5% of bid value (as fixed in the tender).",val:"Bid validity + a cushion (often 45 days) + claim period.",watch:"Released to unsuccessful bidders after award; for the winner it is replaced by a performance guarantee."},
 {n:"Performance Guarantee",cls:"Performance",why:"Secures due performance of the contract (supply, construction, service). Beneficiary claims if the contractor fails to perform.",amt:"Typically 5–10% of contract value.",val:"Contract period + defect liability / warranty period, as per contract.",watch:"Most litigated type. Wording decides whether it is a 'demand' (pay on first written demand) or 'conditional' guarantee."},
 {n:"Advance Payment Guarantee (APG)",cls:"Performance (some banks treat as financial)",why:"Buyer pays a mobilisation / advance to a supplier; the APG assures refund if the supplier does not perform.",amt:"Equal to the advance; usually reduces as the advance is adjusted against running bills (reduction clause).",val:"Until full recovery of the advance.",watch:"Insert an 'effectiveness clause' — guarantee comes into force only when the advance is actually credited to the applicant's account."},
 {n:"Retention Money Guarantee",cls:"Performance",why:"Buyers normally retain 5–10% of each bill until completion. This BG lets the contractor get the retention money released early.",amt:"Equal to retention amount released.",val:"Till end of defect liability period.",watch:"Release is often linked to a completion / taking-over certificate."},
 {n:"Warranty / Maintenance / Defect Liability Guarantee",cls:"Performance",why:"Covers the supplier's obligation to rectify defects during the warranty period.",amt:"Usually 5–10% of contract value.",val:"Warranty period + claim period.",watch:"Often replaces the performance guarantee once supply is complete."},
 {n:"Financial Guarantee",cls:"Financial",why:"Guarantees repayment of a monetary obligation — the bank effectively substitutes its credit for the applicant's (e.g., guaranteeing payment for goods bought on credit, or a statutory dues).",amt:"Full obligation.",val:"Tenor of the obligation.",watch:"Higher risk: 100% credit conversion factor for capital (vs 50% for performance). Appraised like a term loan."},
 {n:"Deferred Payment Guarantee (DPG)",cls:"Financial",why:"Buyer purchases machinery/equipment and pays in instalments over years; bank guarantees each instalment to the seller.",amt:"Total deferred instalments + interest.",val:"Multi-year, matching the instalment schedule.",watch:"Treated as a term-loan-equivalent exposure; appraise cash flows like a term loan."},
 {n:"Customs / GST / Excise / Statutory Guarantee",cls:"Financial",why:"In favour of a government authority — e.g., for provisional assessment, duty-free import under export obligation (EPCG/Advance Authorisation), court orders.",amt:"As demanded by the authority.",val:"Often long and open-ended; authorities frequently ask for 'auto-renewal'.",watch:"Insist on a fixed expiry; open-ended guarantees are a red flag for the bank."},
 {n:"Shipping Guarantee / Delivery-without-B/L guarantee",cls:"Financial / indemnity",why:"Goods reach the port before the original Bill of Lading. Bank guarantees (indemnifies) the shipping line so it releases goods to the importer without the B/L.",amt:"Usually unlimited or 150–200% of invoice value (shipping line's format).",val:"Until the original B/L is surrendered to the shipping line.",watch:"Normally issued only for goods imported under the bank's own LC; the bank commits to accept the documents regardless of discrepancies."},
 {n:"Counter Guarantee (indirect guarantee)",cls:"Depends on underlying",why:"Foreign beneficiary wants a guarantee from a local bank in its own country. Your bank issues a counter-guarantee to that local bank, which then issues the local guarantee.",amt:"Equal to the local guarantee (plus charges).",val:"Local guarantee expiry + mail/claim days.",watch:"Two layers: your bank pays the guarantor bank, which has paid the beneficiary. Governed by URDG 758 if stated."},
 {n:"Standby Letter of Credit (SBLC)",cls:"Financial or performance",why:"A guarantee dressed as an LC — the beneficiary draws only if the applicant defaults. Common in the US (where banks historically could not issue 'guarantees').",amt:"As agreed.",val:"As agreed; evergreen clauses common.",watch:"Governed by ISP98 or UCP 600. Payment is against a simple statement of default."},
 {n:"Payment Guarantee (for supplier credit)",cls:"Financial",why:"Supplier sells on open account; bank guarantees the buyer will pay on due date.",amt:"Invoice value.",val:"Credit period + claim period.",watch:"Close cousin of an SBLC; check FEMA rules for cross-border trade credit."}
];

const LCTYPES = [
 {n:"Irrevocable LC",g:"By revocability",d:"Cannot be amended or cancelled without the agreement of the issuing bank, the confirming bank (if any) and the beneficiary. Under UCP 600 (Art 2, 3, 10) every credit is irrevocable, even if it does not say so.",u:"The default — every LC you will see today."},
 {n:"Revocable LC (historic)",g:"By revocability",d:"Could be cancelled by the issuing bank without notice. Allowed under UCP 500; UCP 600 dropped it. Practically extinct.",u:"Exam questions only."},
 {n:"Confirmed LC",g:"By security",d:"A second bank (usually in the beneficiary's country) adds its own definite undertaking to honour/negotiate (Art 8). The beneficiary now has two independent bank promises.",u:"When the exporter doubts the issuing bank or the issuing bank's country (country risk, transfer risk)."},
 {n:"Unconfirmed LC",g:"By security",d:"Only the issuing bank undertakes. The advising bank merely authenticates and passes it on.",u:"When the issuing bank is well known and the country is stable."},
 {n:"Silent Confirmation",g:"By security",d:"The beneficiary privately buys protection from a bank without the issuing bank's request or knowledge. Not a 'confirmation' under UCP — a bilateral risk contract.",u:"Issuing bank has not asked for confirmation (or forbids it), but exporter wants cover."},
 {n:"Sight LC",g:"By payment time",d:"Payment upon complying presentation — the bank pays after examination (within max 5 banking days).",u:"Exporter needs cash immediately."},
 {n:"Usance / Acceptance LC",g:"By payment time",d:"Beneficiary draws a time draft (e.g., 90 days after B/L date) which the bank accepts; payment on maturity. The accepted draft (banker's acceptance) can be discounted.",u:"Buyer gets credit period; seller gets a bank-accepted bill."},
 {n:"Deferred Payment LC",g:"By payment time",d:"Like usance but without a draft; the bank issues a deferred payment undertaking and pays on the maturity date.",u:"Countries/sectors where draft stamp duty is a nuisance; machinery imports."},
 {n:"Negotiation LC — Restricted",g:"By availability",d:"Only a named bank can negotiate (purchase drafts/documents, advance funds before reimbursement).",u:"Issuing bank wants a known bank to handle documents."},
 {n:"Negotiation LC — Freely negotiable",g:"By availability",d:"'Available with any bank by negotiation' — every bank is a nominated bank.",u:"Gives the exporter flexibility to use its own bank."},
 {n:"UPAS — Usance Payable At Sight",g:"By payment time",d:"An usance LC where the beneficiary is paid at sight: a bank (often an overseas branch) funds the seller and the buyer repays at usance maturity. Interest is for the applicant's account.",u:"Very common in Indian imports — buyer gets cheap credit, seller gets cash. Subject to RBI trade credit norms."},
 {n:"Transferable LC",g:"Special",d:"The first beneficiary (usually a middleman) can ask the transferring bank to make the credit available to one or more second beneficiaries (Art 38). Can be transferred only once; the first beneficiary may substitute its own invoice and draft.",u:"Traders/agents who don't manufacture the goods."},
 {n:"Back-to-Back LC",g:"Special",d:"A middleman uses the LC received (master LC) as security to have its bank open a second, separate LC in favour of the actual supplier. Two independent credits — not covered by Art 38.",u:"When the master LC is not transferable or the trader wants to hide the supplier from the buyer."},
 {n:"Revolving LC",g:"Special",d:"Reinstates automatically after use, up to a time or value limit. Cumulative — unused amount carries forward; Non-cumulative — it lapses.",u:"Regular, repeated shipments to the same buyer."},
 {n:"Red Clause LC",g:"Special (anticipatory)",d:"Authorises the nominated bank to give the beneficiary an advance before shipment (clause traditionally printed in red), against a simple undertaking. Applicant bears the risk.",u:"Pre-shipment finance for trusted suppliers (wool, agri)."},
 {n:"Green Clause LC",g:"Special (anticipatory)",d:"Like red clause, but the advance is against warehouse receipts showing goods stored in the bank's name — more secure.",u:"Commodities stored pending shipment."},
 {n:"Standby LC (SBLC)",g:"Special",d:"Payment only on default; works like a guarantee. Governed by ISP98 (or UCP 600 / URDG 758).",u:"Securing payment obligations, loans, performance."},
 {n:"Import LC / Export LC",g:"By viewpoint",d:"Same instrument seen from two sides: for the issuing (importer's) bank it is an import LC; for the advising/negotiating (exporter's) bank it is an export LC.",u:"Bank department naming."},
 {n:"Inland / Domestic LC",g:"By geography",d:"Buyer and seller in the same country (e.g., inland LC for domestic purchase). In India usually subject to UCP 600 and the bank's inland LC policy.",u:"Domestic credit purchases."},
 {n:"Documentary vs Clean LC",g:"By documents",d:"Documentary — payment against transport/commercial documents. Clean — only a draft or simple demand, no documents (SBLCs are close to clean).",u:"Almost all commercial LCs are documentary."},
 {n:"Straight LC",g:"By availability",d:"The undertaking runs only to the beneficiary presenting at the issuing bank's counters (or a named paying bank), not to negotiating banks.",u:"US-style credits."}
];

const PARTIES = {
 applicant:{t:"Applicant (Importer / Buyer)",d:"Party on whose request the credit is issued (Art 2). Signs the LC application and counter-indemnity, provides margin, pays the issuing bank on a complying presentation. In a BG the applicant is the 'principal debtor'."},
 beneficiary:{t:"Beneficiary (Exporter / Seller)",d:"Party in whose favour the credit is issued. Ships goods and presents documents. Gets paid only if documents comply — not if the goods are perfect."},
 issuing:{t:"Issuing Bank (Opening bank)",d:"Bank that issues the credit at the applicant's request. Gives the definite, irrevocable undertaking to honour a complying presentation (Art 7). Takes credit risk on the applicant."},
 advising:{t:"Advising Bank",d:"Advises the credit to the beneficiary. Its only duty: satisfy itself of the apparent authenticity of the credit and that the advice reflects its terms (Art 9). No undertaking to pay unless it also confirms."},
 confirming:{t:"Confirming Bank",d:"Adds its own definite undertaking, in addition to the issuing bank's, to honour or negotiate (Art 8). Typically the advising bank. Takes risk on the issuing bank and its country."},
 nominated:{t:"Nominated / Negotiating Bank",d:"Bank with which the credit is available (Art 2, 12). It may honour or negotiate; it is not obliged to unless it is the confirming bank. Examines documents and forwards them."},
 reimbursing:{t:"Reimbursing Bank",d:"Bank (often where the currency is cleared, e.g., a New York bank for USD) authorised by the issuing bank to pay the claiming bank. Governed by URR 725. Does not examine documents."}
};

const FLOW = [
 {t:"Sales contract",who:"Buyer ⇄ Seller",d:"Buyer and seller agree: goods, price, Incoterm (say CIF Mundra), payment by 'irrevocable LC at sight, confirmed', latest shipment date, documents required.",tip:"The LC must mirror the contract — but once issued, the bank deals only with the LC (Art 4)."},
 {t:"LC application",who:"Buyer → Issuing bank",d:"Importer submits the LC application, counter-indemnity, margin (cash or within sanctioned NFB limit). Bank checks limits, FEMA/import eligibility, KYC, sanctions screening, and drafts the LC.",tip:"Avoid 'non-documentary conditions' — conditions without a document to evidence them are disregarded (Art 14h)."},
 {t:"Issuance (MT700)",who:"Issuing bank → Advising bank",d:"Issuing bank sends MT700 over SWIFT to the advising bank in the seller's country. From this moment the issuing bank is irrevocably bound (Art 7b).",tip:"Field 40E names applicable rules: 'UCP LATEST VERSION'."},
 {t:"Advising / confirmation",who:"Advising bank → Seller",d:"Advising bank verifies apparent authenticity and advises the LC. If requested (field 49 'CONFIRM') and willing, it adds confirmation.",tip:"Advising ≠ paying. Only confirmation creates a second undertaking."},
 {t:"Seller scrutinises the LC",who:"Seller",d:"Seller checks every term: can I ship by the date? Can I get each document? Amount, tolerance, partial shipment, port names. Seeks amendment (MT707) if needed.",tip:"Partial acceptance of an amendment is not allowed — it is treated as rejection (Art 10e)."},
 {t:"Shipment",who:"Seller → Carrier",d:"Seller ships the goods, obtains the on-board Bill of Lading, insurance (if CIF/CIP), invoice, packing list, certificate of origin, inspection certificate.",tip:"On-board date on the B/L = date of shipment for the 21-day rule (Art 20)."},

V.foundations = ()=>`
<h1>1 · Why trade needs banks</h1>
<p class="lead">An exporter in Gujarat and an importer in Germany don't know each other, are under different laws, and are separated by weeks of sea voyage. Each fears the other: the seller fears shipping and not getting paid; the buyer fears paying and not getting goods. Banks bridge that trust gap by substituting <b>their own creditworthiness</b> for the buyer's (LC) or the seller's/contractor's (BG).</p>
<h2>The payment-risk ladder</h2>
<p>Click each method to see who carries the risk.</p>
<div class="ladder" id="ladder"></div>
<div class="card" id="ladderOut"></div>
<h2>The two big families</h2>
<div class="grid g2">
<div class="card"><h4>Letter of Credit</h4><p><b>Primary payment instrument.</b> The bank promises the seller: "Present these documents within these dates and I will pay." It is <i>expected</i> to be drawn — that's how the seller gets paid.</p><p class="small">Bank's question: Are the documents compliant?</p></div>
<div class="card"><h4>Bank Guarantee</h4><p><b>Secondary / default instrument.</b> The bank promises the beneficiary: "If my customer fails, I will pay you on demand." It is <i>expected not</i> to be drawn — a draw means something went wrong.</p><p class="small">Bank's question: Is the demand in conformity with the guarantee?</p></div>
</div>
<div class="key"><b>The one idea that unlocks everything: autonomy.</b> Both instruments are independent of the underlying contract. The bank doesn't care whether the goods are good or the contractor really defaulted. It looks only at documents (LC) or the demand (BG). This is why banks can process them quickly — and why fraud is the only real escape hatch.</div>
<h2>Non-fund based (NFB) credit</h2>
<p>Banks call LCs and BGs <b>non-fund based</b> facilities: no money leaves the bank on day one, but the bank takes a contingent liability. If the bank has to pay and the customer can't reimburse, the exposure <b>devolves</b> into a fund-based loan. That's why NFB limits are appraised as rigorously as cash credit.</p>
${pager('foundations')}`;

V.bg = ()=>`
<h1>2 · Bank Guarantee fundamentals</h1>
<p class="lead">A bank guarantee is a written, irrevocable undertaking by a bank to pay a sum to the beneficiary if the applicant fails to fulfil an obligation — usually payable on the beneficiary's demand.</p>
<h2>Three parties (Indian Contract Act, Sec 126)</h2>
<div class="tw"><table><tr><th>Contract Act term</th><th>In a BG</th><th>Example (tender)</th></tr>
<tr><td>Principal debtor</td><td>Applicant — bank's customer</td><td>ABC Constructions Pvt Ltd</td></tr>
<tr><td>Creditor</td><td>Beneficiary</td><td>PWD Rajasthan / NHAI</td></tr>
<tr><td>Surety</td><td>Guarantor bank</td><td>Your branch</td></tr></table></div>
<p>Under Sec 128, a surety's liability is co-extensive with the principal debtor's. But courts treat a bank guarantee as an <b>independent contract</b> between bank and beneficiary — the bank must pay according to the terms of the guarantee itself, whatever the dispute between applicant and beneficiary.</p>
<h2>Interactive: read a BG clause</h2>
<p>Click a clause to see what it does and what a vetting officer looks for.</p>
<div class="chips" id="bgclauses"></div>
<div class="card" id="bgclauseOut"><span class="small">Select a clause above.</span></div>
<h2>Demand vs conditional</h2>
<div class="grid g2">
<div class="card"><h4>Unconditional / On-demand</h4><p>"…pay on first written demand without demur, protest or reference to the applicant…". Bank pays on a conforming demand. Over 90% of Indian BGs are worded this way because beneficiaries (Govt, PSUs) insist.</p></div>
<div class="card"><h4>Conditional</h4><p>Payment only if beneficiary proves default — e.g., an arbitral award, or certificate from an engineer. Safer for the applicant, less valued by the beneficiary. Banks prefer to avoid acting as judges, so even 'conditional' terms should be documentary (e.g., "against a copy of an arbitral award").</p></div>
</div>
<h2>Financial vs performance — why the bank cares</h2>
<p>A <b>financial guarantee</b> substitutes for credit (if the customer doesn't pay money, you pay). A <b>performance guarantee</b> covers a non-monetary obligation (if the customer doesn't build the road, you pay). The financial one behaves like a loan — 100% credit conversion factor for capital; performance-related contingents carry 50%.</p>
${pager('bg')}`;

V['bg-law'] = ()=>`
<h1>5 · Law, fraud & URDG 758</h1>
<h2>The autonomy principle in Indian courts</h2>
<p>The Supreme Court has repeatedly held that an unconditional bank guarantee must be honoured according to its terms, regardless of disputes in the underlying contract. Courts will restrain encashment only in narrow cases:</p>
<div class="grid g2">
<div class="card"><h4>1 · Egregious fraud</h4><p>Fraud of an egregious nature, of which the bank has notice, which vitiates the very foundation of the guarantee — clearly established, not just alleged.</p></div>
<div class="card"><h4>2 · Irretrievable injustice / special equities</h4><p>Allowing encashment would cause irretrievable harm — e.g., the applicant could never recover the money (the beneficiary is insolvent abroad).</p></div>
</div>
<p>Landmark cases commonly cited: <i>U.P. Co-operative Federation v. Singh Consultants</i> (1988), <i>Svenska Handelsbanken v. Indian Charge Chrome</i> (1994), <i>U.P. State Sugar Corporation v. Sumac International</i> (1997), <i>Himadri Chemicals v. Coal Tar Refining</i> (2007) and <i>Gujarat Maritime Board v. L&T Infrastructure</i> (2016).</p>
<div class="note">Practical lesson: when an applicant rushes in with "don't pay, we've filed arbitration", the bank pays a conforming demand unless a <b>court order</b> restraining payment is served on it before payment.</div>
<h2>Relevant sections of the Indian Contract Act, 1872</h2>
<div class="tw"><table><tr><th>Section</th><th>Rule</th><th>Effect on BG</th></tr>
<tr><td>124–125</td><td>Contract of indemnity</td><td>Counter-indemnity from applicant to bank.</td></tr>
<tr><td>126</td><td>Contract of guarantee; surety, principal debtor, creditor</td><td>Defines the three parties.</td></tr>
<tr><td>128</td><td>Surety's liability co-extensive</td><td>Modified by the independence of BGs.</td></tr>
<tr><td>133–135, 139</td><td>Variance, release, time to debtor discharge surety</td><td>Beneficiary formats waive these.</td></tr>
<tr><td>140–141</td><td>Surety's subrogation & benefit of securities</td><td>After paying, bank steps into creditor's shoes.</td></tr>
<tr><td>145</td><td>Implied promise to indemnify surety</td><td>Bank recovers from applicant.</td></tr>
<tr><td>28, Exception 3</td><td>Claim period in bank guarantees</td><td>Rights may extinguish after ≥1 year from specified event.</td></tr>
</table></div>
<h2>URDG 758 — international demand guarantees</h2>
<p>ICC Uniform Rules for Demand Guarantees (2010). Apply when the guarantee says so — common for foreign beneficiaries.</p>
<details><summary>Key URDG 758 rules</summary><ul>
<li><b>Art 5</b> — Independence of guarantee and counter-guarantee.</li>
<li><b>Art 15</b> — A demand must be supported by a statement indicating in what respect the applicant is in breach (unless excluded).</li>
<li><b>Art 19–20</b> — Examination on the face; guarantor has <b>5 business days</b> following presentation to examine a demand.</li>
<li><b>Art 23</b> — 'Extend or pay': guarantor may suspend payment up to 30 calendar days.</li>
<li><b>Art 24</b> — Rejection notice must list each reason; failure means preclusion.</li>
<li><b>Art 25</b> — Reduction and termination; if no expiry date, terminates three years after issue (for counter-guarantees, 3 years + 30 days).</li>
<li><b>Art 34–35</b> — Governing law & jurisdiction default to the guarantor's location.</li>
</ul></details>
<h2>ISP98 — standby LCs</h2>
<p>International Standby Practices, built for standbys: documentary, independent, rules on presentation, examination (3 business days not unreasonable; more than 7 deemed unreasonable — Rule 5.01), transfer and assignment. Choose ISP98 for SBLCs; UCP 600 suits commercial LCs.</p>
${pager('bg-law')}`;

<h1>7 · How an LC pays — availability</h1>
<p class="lead">Every credit must state with which bank it is available and how (Art 6b): by <b>sight payment</b>, <b>deferred payment</b>, <b>acceptance</b> or <b>negotiation</b>.</p>

<div class="tw"><table><tr><th></th><th>Sight</th><th>Deferred payment</th><th>Acceptance</th><th>Negotiation</th></tr>
<tr><td>When seller paid</td><td>On compliance</td><td>At maturity</td><td>At maturity (or discount accepted draft)</td><td>Upfront by negotiating bank</td></tr>
<tr><td>Draft needed?</td><td>Optional</td><td>No</td><td>Yes — time draft</td><td>Usually yes</td></tr>
<tr><td>Who gives credit to buyer</td><td>None</td><td>Seller</td><td>Seller (or discounter)</td><td>Depends on tenor</td></tr>

</table></div>
<div class="tip"><b>Recourse:</b> a negotiating bank that is <i>not</i> the confirming bank generally negotiates <b>with recourse</b> to the beneficiary — if the issuing bank doesn't reimburse, it can recover from the exporter. A confirming bank negotiates <b>without recourse</b> (Art 8a ii).</div>

const AVAIL = {
 "Sight payment":"Nominated bank (or issuing bank) pays as soon as it determines the presentation complies. Simplest for the seller. Draft optional.",
 "Deferred payment":"Bank incurs a deferred payment undertaking and pays at maturity (e.g., 180 days after B/L date). No draft. Under Art 12b a nominated bank is authorised to prepay/purchase its own DPU — the seller can get discounting.",
 "Acceptance":"Beneficiary draws a time draft on the nominated bank, which accepts it — creating a banker's acceptance — and pays at maturity. The seller can discount the accepted draft in the market.",

<h1>13 · Incoterms 2020 explorer</h1>
<p class="lead">Incoterms tell you <b>where the seller delivers</b>, <b>when risk passes</b>, and <b>who pays which costs</b>. They do not decide when ownership passes or the price/payment method. Pick a term:</p>
<div class="chips" id="incochips"></div>

<div class="grid g2">
<div class="card"><h4>E — departure</h4>EXW</div>
<div class="card"><h4>F — main carriage unpaid by seller</h4>FCA, FAS, FOB</div>
<div class="card"><h4>C — main carriage paid by seller (two critical points)</h4>CPT, CIP, CFR, CIF</div>
<div class="card"><h4>D — arrival (seller bears transit risk)</h4>DAP, DPU, DDP</div>

<h2>Changes in Incoterms 2020 (vs 2010)</h2>
<ul><li>DAT renamed <b>DPU</b> (any place, not only terminal).</li><li><b>CIP</b> insurance raised to ICC(A); CIF stays ICC(C).</li><li><b>FCA</b> — optional on-board B/L mechanism for LC transactions.</li><li>Seller/buyer may use own transport (FCA, DAP, DPU, DDP).</li><li>Security-related costs allocated explicitly.</li></ul>

V.india = ()=>`
<h1>17 · Indian regulation & practice</h1>
<div class="key"><b>RBI (Non-Fund Based Credit Facilities) Directions, 2025</b> — issued 6 August 2025 (RBI/DOR/2025-26/140), effective 1 April 2026 (or earlier if a bank chose). They consolidate earlier guarantee/LC/co-acceptance circulars into one framework across all regulated entities and repeal many older circulars.</div>
<h2>What the Directions emphasise (headline points)</h2>
<ul>
<li><b>Credit policy:</b> the bank's credit policy must cover NFB facilities — types, limits, appraisal, security, fraud prevention.</li>
<li><b>Same rigour as funded credit:</b> NFB facilities appraised like fund-based exposures.</li>
<li><b>Customers with fund-based facilities:</b> NFB generally only for obligors who have fund-based credit, with defined exceptions (e.g., backed by another RE's counter-guarantee, fully secured by eligible financial collateral, obligors with no fund-based facility from any RE).</li>
<li><b>Inter-RE guarantees:</b> in general, no guarantee favouring another RE to enable it to give fund-based credit to an obligor (trade-related exceptions exist).</li>
<li><b>Devolvement:</b> once an NFB facility devolves, prudential norms of fund-based facilities apply.</li>
<li><b>Partial Credit Enhancement (PCE)</b> to corporate / infra / municipal bonds permitted within limits.</li>
<li><b>Electronic guarantees</b> and disclosure requirements introduced.</li>
</ul>
<div class="note">Read the actual Direction text and your bank's own NFB/BG/LC policy before applying any of this operationally — this page is a learning summary, not a compliance reference.</div>
<h2>Operational practices you'll meet at branch / RO</h2>
<div class="grid g2">
<div class="card"><h4>Stamp duty</h4>BGs are executed on stamp paper as per the State Stamp Act where executed (Rajasthan Stamp Act for Rajasthan branches). Under-stamping can make the instrument inadmissible in evidence.</div>
<div class="card"><h4>SFMS cover (IFN 760 COV)</h4>Banks send a structured SFMS message to the beneficiary's bank for every BG so its genuineness can be verified — a major anti-fraud control after fake-BG frauds.</div>
<div class="card"><h4>e-BG</h4>Electronic BGs via NeSL (and other platforms) — no physical stamp paper (e-stamping), instant verification. Many authorities (e.g., NHAI) accept them.</div>
<div class="card"><h4>Register & follow-up</h4>BG register, expiry diary, claim-period monitoring, periodic commission recovery, reversal of limits on expiry, follow-up for return of original BGs.</div>
<div class="card"><h4>LoU / LoC banned</h4>After the 2018 LoU fraud, RBI discontinued Letters of Undertaking / Comfort for trade credit for imports. LCs and BGs continue, within rules.</div>
<div class="card"><h4>FEMA & FEDAI</h4>Foreign-currency LCs/BGs must comply with FEMA (import of goods, trade credit, guarantees for non-residents) and FEDAI rules on crystallisation of overdue bills, charges and interest.</div>
<div class="card"><h4>Inland LCs</h4>Domestic LCs should cover genuine trade transactions; accommodation bills (without underlying trade) are prohibited. Check transporter (LR) genuineness and GST invoices.</div>
<div class="card"><h4>Margins & security</h4>Margin (cash/FD) and collateral per sanction; counter-indemnity on every BG/LC; check that the BG purpose matches sanction.</div>
</div>
<h2>Fraud red flags</h2>
<ul>
<li>BG verification request directly from a beneficiary when no SFMS cover was sent — possibly a forged BG.</li>
<li>Inland LC bills where buyer and seller are related parties, round-tripping, or LR from unknown transporters.</li>
<li>Applicant pushing for unusual wording (auto-renewal, open amount, payment to third party).</li>
<li>Documents presented that are 'too perfect' or invoices with unrealistic prices (trade-based money laundering).</li>
<li>Sanctions hits on vessel, port or counterparty.</li>
</ul>
${pager('india')}`;

/* ================= INTERACTIONS ================= */
function afterRender(id){
  if(id==='foundations'){
    const M=[["Cash in advance",95,5,"Buyer pays before shipment. Exporter safe; importer bears all risk (may never get goods)."],
      ["Letter of Credit",25,30,"Bank undertakes to pay against compliant documents. Exporter's risk shifts to the bank (and to its own document discipline). Importer is sure documents evidencing shipment exist before paying."],
      ["Collection D/P",45,50,"Banks release documents only against payment, but don't guarantee payment. If buyer refuses, goods sit at the foreign port."],
      ["Collection D/A",70,70,"Documents released on acceptance of a time draft; buyer gets goods and may not pay at maturity. Exporter carries credit risk."],
      ["Open account",95,5,"Goods and documents sent directly; buyer pays later. Importer safe; exporter fully exposed (unless insured/ECGC)."]];
    const L=$('#ladder');
    M.forEach((m,i)=>{const d=document.createElement('div');d.innerHTML='<b>'+m[0]+'</b>';d.onclick=()=>{L.querySelectorAll('div').forEach(x=>x.classList.remove('on'));d.classList.add('on');
      const ex = i===0?5:m[1], im = i===0?95:m[2];
      $('#ladderOut').innerHTML=`<h3 style="margin-top:0">${m[0]}</h3><p>${m[3]}</p><label>Exporter's risk</label><div class="meter"><i style="width:${ex}%;background:var(--accent)"></i></div><label>Importer's risk</label><div class="meter"><i style="width:${im}%;background:var(--teal)"></i></div>`;};L.appendChild(d);if(i===1)d.click();});
  }
  if(id==='bg'){
    const c=$('#bgclauses');CLAUSES.forEach((k,i)=>{const b=document.createElement('button');b.textContent=k[0];b.onclick=()=>{c.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('#bgclauseOut').innerHTML=`<h3 style="margin-top:0">${k[0]}</h3><div class="lc" style="background:var(--j-surface-2);border-radius:6px;padding:8px 12px;font-style:italic">${k[1]}</div><p style="margin-top:10px">${k[2]}</p>`;};c.appendChild(b);});
  }
  if(id==='bg-types'){
    const draw=f=>{$('#bgtypes').innerHTML=BGTYPES.filter(t=>f==='all'||t.cls.includes(f)).map(t=>`<details><summary>${t.n} <span class="tag ${t.cls.startsWith('Fin')?'r':''}">${t.cls}</span></summary><p><b>Why:</b> ${t.why}</p><p><b>Amount:</b> ${t.amt}</p><p><b>Validity:</b> ${t.val}</p><div class="note" style="margin:6px 0 12px">${t.watch}</div></details>`).join('');};
    draw('all');document.querySelectorAll('#bgfilter button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#bgfilter button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');draw(b.dataset.f);});
  }
  if(id==='bg-life'){ bgI=0; const tl=$('#bgtl'); BGFLOW.forEach((s,i)=>{const sp=document.createElement('span');sp.title=s.t;sp.onclick=()=>{bgI=i;bgDraw();};tl.appendChild(sp);}); bgDraw(); }
  if(id==='lc'){
    const show=p=>{document.querySelectorAll('#psvg .party').forEach(g=>g.classList.toggle('on',g.dataset.p===p||(p==='confirming'||p==='nominated')&&g.dataset.p==='advising'));const P=PARTIES[p];$('#partyOut').innerHTML=`<h3 style="margin-top:0">${P.t}</h3><p>${P.d}</p>`;};
    document.querySelectorAll('#psvg .party').forEach(g=>g.onclick=()=>show(g.dataset.p));
    document.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>show(b.dataset.p));
  }
  if(id==='lc-avail'){const c=$('#avchips');Object.keys(AVAIL).forEach((k,i)=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{c.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('#avOut').innerHTML=`<h3 style="margin-top:0">${k}</h3><p>${AVAIL[k]}</p>`;};c.appendChild(b);if(!i)b.click();});}
  if(id==='lc-types'){
    const groups=['All',...new Set(LCTYPES.map(t=>t.g))];let g='All';
    const draw=()=>{const q=($('#lcq').value||'').toLowerCase();$('#lclist').innerHTML=LCTYPES.filter(t=>(g==='All'||t.g===g)&&(t.n+t.d+t.u).toLowerCase().includes(q)).map(t=>`<div class="card" style="margin:0"><span class="tag g">${t.g}</span><h3 style="margin:.3em 0">${t.n}</h3><p>${t.d}</p><p class="small"><b>Used when:</b> ${t.u}</p></div>`).join('')||'<p>No match.</p>';};
    const c=$('#lcg');groups.forEach(x=>{const b=document.createElement('button');b.textContent=x;if(x==='All')b.classList.add('sel');b.onclick=()=>{g=x;c.querySelectorAll('button').forEach(y=>y.classList.remove('sel'));b.classList.add('sel');draw();};c.appendChild(b);});
    $('#lcq').oninput=draw;draw();
  }
  if(id==='lc-flow'){ fI=0; const tl=$('#tl'); FLOW.forEach((s,i)=>{const sp=document.createElement('span');sp.title=s.t;sp.onclick=()=>flowGo(i);tl.appendChild(sp);}); flowDraw(); }
  if(id==='docs'){$('#doclist').innerHTML=DOCS.map(d=>`<details><summary>${d.n} <span class="tag">${d.a}</span></summary><p>${d.d}</p>${d.c.length?'<ul>'+d.c.map(x=>'<li>'+x+'</li>').join('')+'</ul>':''}</details>`).join('');}
  if(id==='ucp'){const draw=()=>{const q=($('#ucpq').value||'').toLowerCase();$('#ucplist').innerHTML=UCP.filter(a=>(a[1]+a[2]+' '+a[0]).toLowerCase().includes(q)).map(a=>`<div class="art"><b class="n">Art ${a[0]}</b><div><b>${a[1]}</b><br><span style="color:var(--ink2)">${a[2]}</span></div></div>`).join('')||'<p>No match.</p>';};$('#ucpq').oninput=draw;draw();}
  if(id==='incoterms'){const c=$('#incochips');Object.keys(INCO).forEach((k,i)=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{c.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');incoDraw(k);};c.appendChild(b);if(k==='CIF')b.click();});}
  if(id==='swift'){const draw=()=>{const q=($('#swq').value||'').toLowerCase();$('#swt').innerHTML='<tr><th>Message</th><th>Purpose</th><th>Typical direction</th></tr>'+SWIFT.filter(s=>s.join(' ').toLowerCase().includes(q)).map(s=>`<tr><td class="mono"><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td></tr>`).join('');};$('#swq').oninput=draw;draw();}
  if(id==='cases'){let r=0,n=0;$('#caselist').innerHTML=CASES.map((c,i)=>`<div class="case" id="c${i}"><b>Case ${i+1}</b><div class="lc"><b>LC:</b> ${c.lc}</div><div class="doc"><b>Presented:</b> ${c.doc}</div><div class="row" style="margin-top:8px"><button data-i="${i}" data-v="1">✓ Compliant</button><button data-i="${i}" data-v="0">✗ Discrepant</button></div><div class="vslot"></div></div>`).join('');
    document.querySelectorAll('#caselist button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,box=$('#c'+i);if(box.dataset.done)return;box.dataset.done=1;const c=CASES[i];const right=(b.dataset.v==='1')===c.ok;n++;if(right)r++;$('#cscore').textContent=r+' / '+n;b.classList.add('sel');box.querySelector('.vslot').innerHTML=`<div class="verdict ${right?'ok':'no'}"><b>${right?'Correct':'Not quite'} — ${c.ok?'Compliant':'Discrepant'}.</b> ${c.e}</div>`;});}
  if(id==='quiz'){let s=0,a=0;$('#qlist').innerHTML=QUIZ.map((q,i)=>`<div class="q" id="q${i}"><b>${i+1}. ${q.q}</b><div class="opts">${q.o.map((o,j)=>`<button data-i="${i}" data-j="${j}">${o}</button>`).join('')}</div><div class="vslot"></div></div>`).join('');
    document.querySelectorAll('#qlist .opts button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j,box=$('#q'+i);if(box.dataset.done)return;box.dataset.done=1;a++;const q=QUIZ[i];if(j===q.a)s++;box.querySelectorAll('.opts button').forEach((x,k)=>{if(k===q.a)x.classList.add('right');else if(k===j)x.classList.add('wrong');});box.querySelector('.vslot').innerHTML=`<div class="verdict ${j===q.a?'ok':'no'}">${q.e}</div>`;$('#qscore').textContent=s;$('#qans').textContent=a;if(a===QUIZ.length){box.querySelector('.vslot').innerHTML+=`<div class="key" style="margin-top:14px"><b>Finished: ${s}/${QUIZ.length} (${Math.round(s/QUIZ.length*100)}%).</b> ${s/QUIZ.length>=.8?'Excellent — you know your trade finance.':'Revisit the modules where you slipped, then reset and try again.'}</div>`;}});}
  if(id==='glossary'){const draw=()=>{const q=($('#glq').value||'').toLowerCase();$('#gll').innerHTML=GLOSS.slice().sort((x,y)=>x[0].localeCompare(y[0])).filter(g=>(g[0]+g[1]).toLowerCase().includes(q)).map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('');};$('#glq').oninput=draw;draw();}
}

let bgI=0;
function bgDraw(){const s=BGFLOW[bgI];document.querySelectorAll('#bgtl span').forEach((x,i)=>x.classList.toggle('on',i<=bgI));$('#bgstep').innerHTML=`<div class="flowstep"><div class="n">${bgI+1}</div><div><h3 style="margin:.1em 0 .3em">${s.t}</h3><p>${s.d}</p></div></div>`;}
function bgMove(d){bgI=Math.max(0,Math.min(BGFLOW.length-1,bgI+d));bgDraw();}

let fI=0;
const NODES={buyer:[70,40,"Buyer"],seller:[690,40,"Seller"],ib:[70,180,"Issuing bank"],ab:[690,180,"Advising/Nom. bank"],rb:[380,180,"Reimb. bank"],carrier:[380,40,"Carrier"]};
const ARROWS=[["buyer","seller","contract"],["buyer","ib","application"],["ib","ab","MT700"],["ab","seller","advice"],["seller","ab","amend?"],["seller","carrier","goods"],["seller","ab","documents"],["ab","ib","docs + MT754"],["ib","buyer","docs / debit"],["buyer","ib","payment"],["rb","ab","reimbursement"],["carrier","buyer","goods vs B/L"]];
function flowDraw(){
  const s=FLOW[fI];document.querySelectorAll('#tl span').forEach((x,i)=>x.classList.toggle('on',i<=fI));
  const a=ARROWS[fI];let svg=`<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--accent)"/></marker></defs>`;
  for(const k in NODES){const [x,y,t]=NODES[k];const act=a[0]===k||a[1]===k;svg+=`<rect x="${x-68}" y="${y-20}" width="136" height="40" rx="8" style="fill:${act?'var(--accent-soft)':'var(--card)'};stroke:${act?'var(--accent)':'var(--line)'};stroke-width:${act?2.5:1}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--ink)">${t}</text>`;}
  const [x1,y1]=NODES[a[0]],[x2,y2]=NODES[a[1]];const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
  const ox=dx/L*72*(Math.abs(dx)>Math.abs(dy)?1:0.4), oy=dy/L*(Math.abs(dy)>Math.abs(dx)?24:20);
  const sx=x1+ox,sy=y1+oy,ex=x2-ox,ey=y2-oy;
  svg+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" style="stroke:var(--accent)" stroke-width="2.5" marker-end="url(#ar2)"/><rect x="${(sx+ex)/2-60}" y="${(sy+ey)/2-12}" width="120" height="22" rx="11" style="fill:var(--accent)"/><text x="${(sx+ex)/2}" y="${(sy+ey)/2+3}" text-anchor="middle" font-size="11.5" style="fill:var(--j-on-accent)">${a[2]}</text>`;
  $('#fsvg').innerHTML=svg;
  $('#fstep').innerHTML=`<div class="flowstep"><div class="n">${fI+1}</div><div><h3 style="margin:.1em 0 .2em">${s.t}</h3><span class="tag">${s.who}</span><p>${s.d}</p><div class="tip" style="margin:6px 0 0">${s.tip}</div></div></div>`;
}
function flowMove(d){fI=Math.max(0,Math.min(FLOW.length-1,fI+d));flowDraw();}
function flowGo(i){fI=i;flowDraw();}

function incoDraw(k){
  const t=INCO[k];
  const bar=(lim,lab)=>`<div class="jbar">${STAGES.map((s,i)=>`<div class="${i<lim?'s':'b'}">${i===0?lab:''}</div>`).join('')}</div>`;
  $('#incoOut').innerHTML=`<h2 style="margin-top:0;border:0">${k} — ${t.n} <span class="tag">${t.m}</span></h2>
  <div class="journey">${STAGES.map(s=>`<div class="st">${s}</div>`).join('')}</div>
  <div class="small">Risk <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--teal);margin:0 4px 0 10px"></span>seller<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--gold);margin:0 4px 0 10px"></span>buyer</div>${bar(k==='EXW'?0:Math.min(10,t.risk+1),'')}
  <div class="small">Cost</div>${bar(k==='EXW'?0:Math.min(10,t.cost+1),'')}
  <div class="tw"><table><tr><th>Risk passes</th><td>${k==='EXW'?'At seller\'s premises, goods placed at buyer\'s disposal':'After: '+STAGES[t.risk]}</td></tr>
  <tr><th>Insurance</th><td>${t.ins}</td></tr><tr><th>Export clearance</th><td>${t.exp}</td></tr><tr><th>Import clearance</th><td>${t.imp}</td></tr>
  <tr><th>LC documents</th><td>${t.doc}</td></tr></table></div><p>${t.note}</p>`;
}

/* calculators */
const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const F=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
const add=(d,n)=>new Date(d.getTime()+n*864e5);
const wk=d=>d.getUTCDay()===0||d.getUTCDay()===6;
function t1(){const s=D($('#t1s').value),e=D($('#t1e').value),p=+$('#t1p').value;let last=add(s,p);let txt=`Shipment + ${p} days = <b>${F(last)}</b><br>`;let lim=last<e?last:e;txt+=`Earlier of that and expiry (${F(e)}) = <b>${F(lim)}</b>`;
 if(lim.getTime()===e.getTime()&&$('#t1w').checked&&wk(e)){let x=e;while(wk(x))x=add(x,1);txt+=`<br>Expiry falls on a weekend → extended to next banking day <b>${F(x)}</b> (Art 29a).`;}
 else if($('#t1w').checked&&wk(lim)){let x=lim;while(wk(x))x=add(x,1);txt+=`<br>Last day for presentation falls on a weekend → extends to the next banking day <b>${F(x)}</b> (Art 29a). The latest shipment date is never extended (Art 29c).`;}
 $('#t1o').innerHTML=txt;}
function t2(){const s=D($('#t2s').value),n=+$('#t2d').value;$('#t2o').innerHTML=`Maturity = base date excluded, count ${n} days → <b>${F(add(s,n))}</b><br><span style="color:#aab">Art 3: 'from'/'after' for maturity excludes the date mentioned. If maturity is a non-banking day, payment is made on the next banking day.</span>`;}
function t3(){const s=D($('#t3s').value);$('#t3o').innerHTML=`Window: <b>${F(add(s,-5))}</b> to <b>${F(add(s,5))}</b>, both inclusive (11 days).`;}
function t4(){const A=+$('#t4a').value,Q=+$('#t4q').value,b=$('#t4b').value,ab=$('#t4ab').checked,da=+$('#t4da').value,dq=+$('#t4dq').value;let out=[];
 const amax=ab?A*1.1:A;out.push(`Amount: drawing ${da.toLocaleString()} vs max ${amax.toLocaleString()} → <b>${da<=amax?'OK':'EXCEEDS'}</b>`);
 let qmin,qmax,basis;if(ab){qmin=Q*.9;qmax=Q*1.1;basis="'about' ±10%";}else if(b==='bulk'){qmin=Q*.95;qmax=Q*1.05;basis='±5% bulk tolerance (Art 30b)';}else{qmin=Q;qmax=Q;basis='no tolerance (units/items)';}
 const qok=dq>=qmin&&dq<=qmax;out.push(`Quantity: ${dq} vs allowed ${qmin.toFixed(2)}–${qmax.toFixed(2)} [${basis}] → <b>${qok?'OK':'OUTSIDE'}</b>`);
 if(!ab&&b==='bulk'&&da>A)out.push('Note: the 5% quantity tolerance applies only if the drawing does not exceed the credit amount.');
 $('#t4o').innerHTML=out.join('<br>')+`<br>Overall: <b>${(da<=amax&&qok&&!(b==='bulk'&&!ab&&da>A))?'Compliant on tolerance':'Discrepant'}</b>`;}
function t5(){const v=+$('#t5v').value,i=+$('#t5i').value,m=v*1.1;$('#t5o').innerHTML=`Minimum required (if LC is silent) = 110% × ${v.toLocaleString()} = <b>${m.toLocaleString()}</b><br>Insured: ${i.toLocaleString()} (${(i/v*100).toFixed(1)}%) → <b>${i>=m?'OK':'SHORT — discrepant'}</b>`;}
function t6(){const e=D($('#t6e').value),c=D($('#t6c').value),d=D($('#t6d').value);const one=new Date(Date.UTC(e.getUTCFullYear()+1,e.getUTCMonth(),e.getUTCDate()));let o=[];
 o.push(`Claim period after expiry: ${Math.round((c-e)/864e5)} days → ${c>=one?'<b>≥ 1 year — consistent with s.28 Exc. 3</b>':'<b>less than 1 year — check: s.28 Exc. 3 requires not less than one year from the specified event</b>'}`);
 o.push(d<=e?'Demand within validity → <b>valid on timing</b>':d<=c?'Demand after expiry but within claim period → <b>valid on timing</b> (check your BG wording: some formats require the claim to be lodged within validity and enforced within the claim period)':'Demand after claim date → <b>time-barred; rights extinguished</b>');
 $('#t6o').innerHTML=o.join('<br>');}
function t7(){let d=D($('#t7s').value);const h=($('#t7h').value||'').split(',').map(x=>x.trim()).filter(Boolean);const n=+$('#t7r').value;let c=0,x=d;const isOff=z=>wk(z)||h.includes(z.toISOString().slice(0,10));const list=[];
 while(c<n){x=add(x,1);if(!isOff(x)){c++;list.push(F(x));}}$('#t7o').innerHTML=`Presentation: ${F(d)}<br>Banking days counted (following presentation): ${list.join(' · ')}<br>Deadline: close of business on <b>${F(x)}</b>`;}

/* ================= ROUTER ================= */
function render(){
  let id=(location.hash||'').slice(1);if(!V[id])id='home';
  $('#main').innerHTML=V[id]();afterRender(id);
  if(id!=='home'){seen[id]=1;saveSeen();}
  updateNav(id);window.scrollTo(0,0);
  // the item that was focused got replaced (e.g. a Course map card) → keep the remote in the reading pane
  if(document.activeElement===document.body) $('#main').focus({preventScroll:true});
  if(window.Jharokha && !backing) Jharokha.remember({app:'bglc', title:'BG & LC Masterclass', sub:TITLES[id]||'Course map', url:location.href, scroll:0});
}
let backing=false;   // true while the user is stepping back with the remote: don't overwrite "Continue"
buildNav();window.addEventListener('hashchange',()=>{backing=false;render();});
(function firstRender(){
  // Opened from "Continue": put the reader back where they left off.
  const r = window.Jharokha && Jharokha.recentFor('bglc');
  const resume = r && r.url === location.href && r.scroll > 0 ? r.scroll : 0;
  render();
  if (resume) { setTimeout(()=>window.scrollTo(0, resume), 60); Jharokha.remember(Object.assign({}, r, {scroll: resume})); }
})();

/* Remote Back goes UP a level instead of replaying every chapter visited:
   reading pane -> chapter menu -> course map -> Jharokha home. */
window.JharokhaPageBack = function(){
  const here = (location.hash||'').slice(1);
  if (window.Jharokha && V[here] && here !== 'home') {
    // Save exactly where the reader was (chapter + scroll) before stepping out.
    Jharokha.remember({app:'bglc', title:'BG & LC Masterclass', sub:TITLES[here], url:location.href, scroll:Math.round(scrollY)});
  }
  backing = true;
  const main = document.getElementById('main'), nav = document.getElementById('nav');
  const navShown = nav.getBoundingClientRect().right > 0;
  const a = document.activeElement;
  if (navShown && a && main.contains(a)) {
    const cur = nav.querySelector('a.on') || nav.querySelector('a[data-id]');
    if (cur) { cur.focus({preventScroll:true}); cur.scrollIntoView({block:'nearest'}); return true; }
  }
  const id = (location.hash||'').slice(1);
  if (V[id] && id !== 'home') {
    history.replaceState(null, '', '#home'); render();
    const m = nav.querySelector('a[data-id="home"]'); if (m && navShown) m.focus({preventScroll:true});
    return true;
  }
  if (window.Jharokha) { Jharokha.home(); return true; }
  return false;
};
